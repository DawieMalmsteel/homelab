apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # xoá Application -> xoá luôn tài nguyên nó quản lý
spec:
  project: default
  source:
    repoURL: REPO_URL
    targetRevision: main
    path: k8s/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
